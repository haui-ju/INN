# Config del proyecto. Lo leen y actualizan las skills 00-init, 00-init-update y las numeradas.
# Puedes editar los valores a mano. Los comentarios explicativos de cada campo se regeneran al guardar;
# los comentarios propios que agregues se pierden cuando una skill escribe este archivo.

schema: 3  # versión del formato (no cambiar)
proyecto:  # datos generales del proyecto
  nombre: Mejora del margen por canal y reducción de la merma con Power BI para Pollerías y Parrilladas San Martín  # nombre corto del proyecto
  tema: ""  # problema y solución de BI en una frase (copia del brief; lo define 01-make-project-brief)
  tipo: empresa  # empresa = se aplica a una empresa (requiere ruc) · propio = proyecto o solución propia, sin empresa
  ruc: "20537751950"  # RUC de 11 dígitos (solo si tipo es empresa; con él se buscan sus datos en domain.md) · null si es propio
  rubro: restaurantes (pollerías)  # sector o giro (por ejemplo: restaurantes, retail, salud)
equipo:  # integrantes del equipo
  - nombre: Salim Felix Escovedo  # nombre del integrante
    rol: null  # responsabilidad en el proyecto, texto libre (por ejemplo: Analista de datos) · null si aún no tiene
  - nombre: Luis Fernando Melgar Pizarro  # nombre del integrante
    rol: null  # responsabilidad en el proyecto, texto libre (por ejemplo: Analista de datos) · null si aún no tiene
