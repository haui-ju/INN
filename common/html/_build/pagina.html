<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titulo}}</title>
<style id="tokens">
/*tokens:inicio*/
/*tokens:fin*/
</style>
<script>
try {
  var g = localStorage.getItem("tema");
  var d = getComputedStyle(document.documentElement).getPropertyValue("--tema-defecto").trim() === "oscuro" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", g === "dark" || g === "light" ? g : d);
} catch (e) {}
</script>
<style id="estilos">
{{estilos}}
</style>
</head>
<body>
<div id="raiz"></div>
<noscript><p style="padding:2rem;text-align:center;font-family:system-ui,sans-serif">Este visual necesita JavaScript para mostrarse.</p></noscript>
<script type="application/json" id="datos">{{datos}}</script>
<script id="app">
{{app}}
</script>
</body>
</html>
